services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: homework
      POSTGRES_PASSWORD: homework
      POSTGRES_DB: homework
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homework"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ../backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://homework:homework@postgres:5432/homework?sslmode=disable
      STORAGE_DIR: /app/storage
      FRONTEND_ORIGIN: http://localhost:3000
      SECRET_KEY: dev-secret-change-me
      # AI runs on GLM. Put your Z.AI coding-plan key in docker/.env (gitignored)
      # as AI_API_KEY — see docker/.env.example. Without a key the app still boots,
      # but exam generation / tutor / material reading won't work.
      AI_PROVIDER: ${AI_PROVIDER:-glm}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      AI_MODEL: ${AI_MODEL:-glm-5.3}
      VISION_PROVIDER: ${VISION_PROVIDER:-glm}
      VISION_MODEL: ${VISION_MODEL:-glm-5.3-flash}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      REVIEW_CONFIDENCE_THRESHOLD: "0.80"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/storage

  # One-shot: seed the demo dataset, then exit. Run with:
  #   docker compose run --rm seed
  seed:
    build: ../backend
    command: ["/app/seed"]
    environment:
      DATABASE_URL: postgres://homework:homework@postgres:5432/homework?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  frontend:
    build: ../frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    profiles: ["full"]

volumes:
  pgdata:
  uploads:
